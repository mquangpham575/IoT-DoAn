<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Health Dashboard | Mobile</title>
    <link rel="icon" href="data:," />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --blue: #3b82f6;
        --red: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      .status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg);
        z-index: 20;
      }

      .status-card {
        width: 100%;
        max-width: 520px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        padding: 18px;
      }

      .status-title {
        font-weight: 800;
        font-size: 16px;
        margin-bottom: 8px;
      }

      .status-hint {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
        white-space: pre-wrap;
      }

      .iframe-wrap {
        position: fixed;
        inset: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: var(--bg);
      }
    </style>
  </head>

  <body>
    <div class="status" id="status">
      <div class="status-card">
        <div class="status-title" id="status-title">Loading dashboard…</div>
        <div class="status-hint" id="status-hint"></div>
      </div>
    </div>

    <script>
      const DEFAULT_SERVER_URL = "http://20.212.105.13:8000";
      const DEFAULT_DASHBOARD_TOKEN = "IoT_Health";
      const statusEl = document.getElementById("status");
      const statusTitleEl = document.getElementById("status-title");
      const statusHintEl = document.getElementById("status-hint");

      function buildDashboardUrl(serverUrl, token) {
        const safeToken = encodeURIComponent((token || "").trim());
        return `${serverUrl.replace(/\/$/, "")}/?token=${safeToken}`;
      }

      const dashUrl = buildDashboardUrl(
        DEFAULT_SERVER_URL,
        DEFAULT_DASHBOARD_TOKEN,
      );
      statusHintEl.textContent = `URL: ${dashUrl}`;

      // Important: avoid embedding http:// content inside the Capacitor app page.
      // On Android WebView this is commonly blocked as mixed-content, resulting in a blank/black iframe.
      // Use top-level navigation instead.
      setTimeout(() => {
        statusTitleEl.textContent = "Opening dashboard…";
        window.location.replace(dashUrl);
      }, 100);

      // If navigation is blocked, the page will remain here.
      setTimeout(() => {
        statusTitleEl.textContent = "Dashboard didn't open";
        statusHintEl.textContent = `URL: ${dashUrl}\n\nIf this stays here: check Internet and ensure Capacitor allowNavigation allows 20.212.105.13.`;
      }, 6000);
    </script>
  </body>
</html>
